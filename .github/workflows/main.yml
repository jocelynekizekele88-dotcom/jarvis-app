name: Construire l'APK Jarvis

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer les dependances
        run: npm install

      - name: Brancher l'IA (si la variable JARVIS_ENDPOINT existe)
        env:
          JARVIS_ENDPOINT: ${{ vars.JARVIS_ENDPOINT }}
        run: |
          if [ -n "$JARVIS_ENDPOINT" ]; then
            echo "window.JARVIS_CONFIG = { endpoint: \"$JARVIS_ENDPOINT\" };" > www/config.js
          fi

      - name: Creer le projet Android avec les icones Jarvis
        run: |
          rm -rf android
          npx cap add android
          if [ -d android-res ]; then cp -r android-res/. android/app/src/main/res/; fi
          npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Mettre l'APK a telecharger
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
